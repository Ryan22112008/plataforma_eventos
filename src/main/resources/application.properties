# ===================================================================
# CONFIGURAÇÕES DA APLICAÇÃO & SERVIDOR
# ===================================================================
spring.application.name=eventos
server.port=8080
server.servlet.context-path=
server.error.path=/error

# ===================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (H2)
# ===================================================================
# CORRIGIDO: Separado o comando AUTO_SERVER do username e adicionado o fechamento correto do banco
spring.datasource.url=jdbc:h2:file:./dados/even3db;AUTO_SERVER=true;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===================================================================
# Mantido o dialeto explícito para evitar problemas de metadados com o Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Exibição e formatação organizada do SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Garante a execução correta de scripts adicionais (como o data.sql) se houverem
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

spring.thymeleaf.cache=false

 spring.web.resources.add-mappings=true
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Força o Thymeleaf e o Spring a lerem os arquivos HTML e strings em UTF-8 nativo
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Caminho unificado para armazenamento de uploads (o ./ garante a raiz do JAR executável)
# Se existir a variável UPLOAD_DIR no servidor, usa ela. Se não, cria a pasta 'uploads' na raiz
app.upload.dir=${UPLOAD_DIR:uploads}
server.error.include-message=always


# ===================================================================
# CONFIGURAÇÃO DO GMAIL CORPORATIVO SEPLAG (PORTA 465 SSL)
# ===================================================================
