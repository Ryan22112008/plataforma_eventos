# ===================================================================
# CONFIGURAÇÕES DA APLICAÇÃO & SERVIDOR
# ===================================================================
spring.application.name=eventos
server.port=${PORT:8080}
server.servlet.context-path=
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.error.path=/error
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (MySQL no Render; H2 local)
# ===================================================================
# DATABASE_URL é lido por DatabaseUrlDataSourceConfig quando configurado.
# Sem DATABASE_URL, a aplicação usa H2 local/persistente.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./dados}/even3db;AUTO_SERVER=true;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ===================================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===================================================================
# O Hibernate detecta o dialeto correto a partir do DataSource ativo.
spring.jpa.hibernate.ddl-auto=update

# Exibição e formatação organizada do SQL no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Garante a execução correta de scripts adicionais (como o data.sql) se houverem
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.thymeleaf.cache=false

 spring.web.resources.add-mappings=true
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Força o Thymeleaf e o Spring a lerem os arquivos HTML e strings em UTF-8 nativo
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Caminho unificado para armazenamento de uploads (o ./ garante a raiz do JAR executável)
# Se existir a variável UPLOAD_DIR no servidor, usa ela. Se não, cria a pasta 'uploads' na raiz
app.upload.dir=${UPLOAD_DIR:uploads}
app.public-url=${APP_PUBLIC_URL:}
app.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:}


# ===================================================================
# CONFIGURAÇÃO DO GMAIL CORPORATIVO SEPLAG (PORTA 465 SSL)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465

# 🎯 Unificado: E-mail da SEPLAG como remetente autenticado
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Protocolos de Autenticação e Segurança SSL oficiais do Java
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
