<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/seplag-ui :: head('Quizzes')}"></head><body class="v2 seplag-shell">
<aside th:replace="~{fragments/seplag-ui :: sidebar('quizzes')}"></aside><div class="seplag-main"><header th:replace="~{fragments/seplag-ui :: topbar('Quizzes', 'Organizador')}"></header><main class="seplag-content quiz-page">
<div class="seplag-page-head"><div><p class="seplag-eyebrow">Aprendizagem ao vivo</p><h1>Quizzes e banco de perguntas</h1><p>Crie rodadas, escolha perguntas por dificuldade e acompanhe o desempenho dos participantes.</p></div></div>
<p class="quiz-success" th:if="${mensagemQuiz}" th:text="${mensagemQuiz}"></p>
<section class="quiz-card"><h2>Criar quiz para um evento</h2><form class="quiz-inline" th:action="@{/organizador/quizzes/novo}" method="get"><label>Evento<select name="eventoId" required><option value="">Selecione um evento</option><option th:each="e : ${eventos}" th:value="${e.id}" th:text="${e.titulo}"></option></select></label><button class="quiz-btn" type="submit">Criar quiz <span>→</span></button></form></section>
<section class="quiz-card"><h2>Seus quizzes</h2><p th:if="${#lists.isEmpty(quizzes)}" class="quiz-muted">Seus quizzes aparecerão aqui.</p><div class="quiz-list"><article class="quiz-list-item" th:each="q : ${quizzes}"><div><span class="quiz-chip" th:text="${q.status}">RASCUNHO</span><h3 th:text="${q.titulo}">Quiz</h3><p th:text="${q.evento.titulo + ' · ' + q.perguntas.size() + ' perguntas'}">Evento</p></div><div class="quiz-list-actions"><a class="quiz-btn quiz-btn-light" th:href="@{/organizador/quizzes/{id}(id=${q.id})}">Abrir →</a><form th:action="@{/organizador/quizzes/{id}/excluir(id=${q.id})}" method="post" onsubmit="return confirm('Excluir este quiz e todos os seus resultados? Esta ação não pode ser desfeita.');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="quiz-btn quiz-btn-danger" type="submit">Excluir</button></form></div></article></div></section>
</main></div></body></html>
