<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/seplag-ui :: head('Acessar quiz')}"></head><body class="quiz-public"><main class="quiz-join-card quiz-pin-card"><a th:href="@{/}" class="quiz-back">← SEPLAG Eventos</a><div class="quiz-brand-mark">✦</div><p class="quiz-eyebrow">QUIZ AO VIVO</p><h1>Entre em uma partida</h1><p>Digite o PIN de 6 números mostrado pelo anfitrião. Você também pode apontar a câmera para o QR Code da sala.</p><div class="quiz-entry-error" th:if="${param.invalido}" role="alert">Não encontramos uma partida com esse PIN. Confira o código e tente novamente.</div><form th:action="@{/quiz/acessar}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="quiz-nickname-label">PIN da partida<input type="text" name="codigo" required minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" inputmode="numeric" placeholder="Ex.: 482915" autofocus></label><button class="quiz-btn quiz-btn-wide">Continuar <span>→</span></button></form></main></body></html>
