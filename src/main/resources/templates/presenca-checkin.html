<!DOCTYPE html>
<html lang="pt-BR" class="v2-root" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar presença | SEPLAG-MT</title>
    <link rel="stylesheet" th:href="@{/css/seplag-ui-v2.css}">
</head>
<body class="v2 seplag-public">
<a class="seplag-skip-link" href="#conteudo">Ir para o conteúdo</a>
<header th:replace="~{fragments/seplag-ui :: public-header('')}"></header>

<main class="seplag-public-main seplag-public-main--narrow" id="conteudo">
    <nav class="seplag-breadcrumb" aria-label="Trilha de navegação">
        <ol>
            <li><a th:href="@{/}">Início</a></li>
            <li aria-current="page">Confirmação de presença</li>
        </ol>
    </nav>

    <section class="seplag-card" aria-labelledby="checkin-heading">
        <div class="seplag-card__header">
            <div>
                <p class="seplag-eyebrow">Confirmação de presença</p>
                <h1 id="checkin-heading" class="seplag-card__title" th:text="${sessao.nome}">Sessão</h1>
                <p class="seplag-card__hint" th:text="${#temporals.format(sessao.dataHoraInicio, 'dd/MM/yyyy HH:mm')}">Data e hora</p>
            </div>
        </div>
        <div class="seplag-card__body">
            <div th:if="${mensagemSucesso}" class="seplag-alert seplag-alert--success" role="status" th:text="${mensagemSucesso}"></div>
            <div th:if="${mensagemErro}" class="seplag-alert seplag-alert--error" role="alert" th:text="${mensagemErro}"></div>

            <form th:unless="${mensagemSucesso}" th:action="@{/participante/presencas/checkin}" method="post" class="seplag-form">
                <input type="hidden" name="token" th:value="${token}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="seplag-form-actions">
                    <button type="submit" class="seplag-btn seplag-btn-success">Confirmar minha presença</button>
                    <a th:href="@{/dashboard}" class="seplag-btn seplag-btn-secondary">Ir para meu painel</a>
                </div>
            </form>
            <div th:if="${mensagemSucesso}" class="seplag-form-actions">
                <a th:href="@{/dashboard}" class="seplag-btn seplag-btn-secondary">Ir para meu painel</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/seplag-ui :: public-footer}"></footer>
</body>
</html>
