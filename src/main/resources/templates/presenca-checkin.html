<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar presença | SEPLAG-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/seplag-ui.css}">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-6 sm:p-8 shadow-sm">
    <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-xl" aria-hidden="true">
        <i class="fa-solid fa-clipboard-check"></i>
    </div>
    <p class="mt-5 text-sm font-semibold uppercase tracking-wider text-[#0b4d7e]">Confirmação de presença</p>
    <h1 class="mt-2 text-2xl font-bold text-gray-900" th:text="${sessao.nome}">Sessão</h1>
    <p class="mt-2 text-sm text-gray-600" th:text="${#temporals.format(sessao.dataHoraInicio, 'dd/MM/yyyy HH:mm')}">Data e hora</p>

    <div th:if="${mensagemSucesso}" role="status" class="mt-5 rounded-lg bg-emerald-50 p-3 text-sm text-emerald-800" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" role="alert" class="mt-5 rounded-lg bg-rose-50 p-3 text-sm text-rose-800" th:text="${mensagemErro}"></div>

    <form th:unless="${mensagemSucesso}" th:action="@{/participante/presencas/checkin}" method="post" class="mt-6">
        <input type="hidden" name="token" th:value="${token}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="w-full min-h-12 rounded-lg bg-[#07844c] px-5 py-3 font-semibold text-white hover:bg-[#066c3e]">
            Confirmar minha presença
        </button>
    </form>
    <a th:href="@{/dashboard}" class="mt-4 inline-flex text-sm font-medium text-[#0b4d7e] hover:underline">Ir para meu painel</a>
</main>
</body>
</html>
