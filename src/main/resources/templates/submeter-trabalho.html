<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissão de Trabalho | SEPLAG-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F4F6F9] min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

<div class="sm:mx-auto w-full max-w-md">
    <div class="text-center">
        <div class="inline-flex bg-[#00457C] text-white p-3 rounded font-bold text-xl mb-4 shadow-sm">MT</div>
        <h2 class="text-2xl font-bold tracking-tight text-[#00457C]">Entrega de Trabalho</h2>
        <p class="mt-2 text-sm text-gray-600" th:text="'Evento: ' + ${inscricao.evento.titulo}">Nome do Evento</p>
    </div>

    <div class="mt-6 sm:mx-auto w-full max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-xl sm:px-10 border border-gray-200">

            <form th:action="@{/participante/inscricoes/{id}/submeter(id=${inscricao.id})}" method="post" enctype="multipart/form-data">

                <label class="block text-sm font-medium text-gray-700 mb-2">Arquivo do Trabalho</label>

                <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-[#00457C] transition-colors">
                    <i class="fa-regular fa-file-pdf text-4xl text-red-500 mb-3"></i>

                    <div class="space-y-1">
                        <p class="text-sm font-medium text-[#00457C]">Faça upload do seu artigo</p>
                        <p class="text-xs text-gray-500">Apenas arquivos no formato PDF (Máx. 10MB)</p>
                    </div>

                    <input type="file" name="file" accept="application/pdf" class="mt-4 text-sm text-gray-600" required />
                </div>

                <div class="mt-6 flex space-x-3">
                    <a th:href="@{/participante/meus-ingressos}" class="w-1/2 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-lg text-sm font-medium transition-colors">Cancelar</a>
                    <button type="submit" class="w-1/2 bg-[#008A4B] hover:bg-[#00703c] text-white py-3 rounded-lg text-sm font-medium transition-colors shadow">Entregar Trabalho / PDF</button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    // Script sênior de UX para mostrar o nome do arquivo selecionado na tela
    document.getElementById('arquivo').onchange = function () {
        if(this.files[0]) {
            alert("Arquivo selecionado com sucesso: " + this.files[0].name);
        }
    };
</script>

</body>
</html>
