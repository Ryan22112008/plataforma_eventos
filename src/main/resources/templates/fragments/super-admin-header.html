<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<body>
<header th:fragment="header(active)" class="seplag-admin-header">
    <div class="seplag-admin-header__inner">
        <a th:href="@{/}" class="seplag-admin-header__brand">
            <img th:src="@{/images/logo-seplag-branco.png}" alt="Logotipo SEPLAG-MT" class="seplag-admin-header__logo">
            <span class="seplag-admin-header__brand-text">
                <strong>Painel Corporativo SEPLAG</strong>
                <small>Super Administração</small>
            </span>
        </a>

        <nav aria-label="Navegação do Super Admin" class="seplag-admin-nav">
            <a th:href="@{/super-admin/usuarios}" class="seplag-admin-nav__link" th:classappend="${active == 'usuarios'} ? ' is-active'" th:attr="aria-current=${active == 'usuarios' ? 'page' : null}"><i class="fa-solid fa-users" aria-hidden="true"></i>Usuários</a>
            <a th:href="@{/super-admin/organizadores}" class="seplag-admin-nav__link" th:classappend="${active == 'organizadores'} ? ' is-active'" th:attr="aria-current=${active == 'organizadores' ? 'page' : null}"><i class="fa-solid fa-user-group" aria-hidden="true"></i>Organizadores</a>
            <a th:href="@{/super-admin/solicitacoes}" class="seplag-admin-nav__link" th:classappend="${active == 'solicitacoes'} ? ' is-active'" th:attr="aria-current=${active == 'solicitacoes' ? 'page' : null}"><i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>Solicitações</a>
        </nav>

        <div class="seplag-admin-header__actions">
            <span class="seplag-admin-header__divider" aria-hidden="true"></span>
            <div class="seplag-admin-user">
                <span class="seplag-admin-user__name" sec:authentication="name">Usuário</span>
                <span class="seplag-admin-user__role">Super Administrador</span>
            </div>
            <a th:href="@{/}" class="seplag-admin-header__site"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Menu principal</span></a>
            <form th:action="@{/logout}" method="post" class="inline-flex">
                <button type="submit" class="seplag-admin-logout"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i><span>Sair</span></button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
