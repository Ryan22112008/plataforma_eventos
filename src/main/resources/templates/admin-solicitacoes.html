<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitações de organizador | SEPLAG-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/seplag-ui.css}">
</head>
<body class="min-h-screen flex flex-col">
<header class="bg-[#082f57] text-white border-b-4 border-[#FDB813]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
        <a th:href="@{/}" class="flex items-center gap-3 rounded focus-visible:outline-white">
            <img th:src="@{/images/logo-seplag-branco.png}" alt="SEPLAG-MT" class="h-11 w-auto object-contain">
            <span class="font-semibold">Administração</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="rounded-lg bg-white/10 px-4 py-2 text-sm font-semibold hover:bg-white/20">Sair</button>
        </form>
    </div>
</header>
<main class="max-w-6xl w-full mx-auto px-4 sm:px-6">
    <div class="mb-7">
        <p class="text-sm font-semibold uppercase tracking-wider text-[#07844c]">Acesso administrativo</p>
        <h1 class="mt-1 text-3xl font-bold text-[#082f57]">Solicitações de organizador</h1>
        <p class="mt-2 text-gray-600">Revise os dados da conta antes de aprovar o acesso ao painel de eventos.</p>
    </div>
    <div th:if="${sucesso}" role="status" class="mb-5 rounded-lg bg-emerald-50 p-4 text-sm text-emerald-800">A solicitação foi aprovada.</div>
    <div th:if="${erro}" role="alert" class="mb-5 rounded-lg bg-rose-50 p-4 text-sm text-rose-800" th:text="${erro}"></div>
    <div th:if="${solicitacoes == null or solicitacoes.isEmpty()}" class="rounded-2xl border border-gray-200 bg-white p-10 text-center shadow-sm">
        <i class="fa-solid fa-circle-check text-3xl text-emerald-600" aria-hidden="true"></i>
        <h2 class="mt-3 text-lg font-bold text-gray-900">Tudo em dia</h2>
        <p class="mt-1 text-sm text-gray-600">Não há solicitações pendentes no momento.</p>
    </div>
    <div th:if="${solicitacoes != null and !solicitacoes.isEmpty()}" class="space-y-4">
        <article th:each="solicitacao : ${solicitacoes}" class="flex flex-col gap-5 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h2 class="font-bold text-gray-900" th:text="${solicitacao.usuario.nome}">Nome</h2>
                <p class="mt-1 text-sm text-gray-600" th:text="${solicitacao.usuario.email}">—</p>
                <p class="mt-1 text-xs text-gray-500" th:text="${#temporals.format(solicitacao.dataSolicitacao, 'dd/MM/yyyy HH:mm')}">Data</p>
            </div>
            <form th:action="@{/admin/solicitacoes/{id}/aprovar(id=${solicitacao.id})}" method="post">
                <button type="submit" class="w-full rounded-lg bg-[#07844c] px-5 py-3 text-sm font-semibold text-white hover:bg-[#066c3e] sm:w-auto">
                    <i class="fa-solid fa-user-check mr-2" aria-hidden="true"></i>Aprovar organizador
                </button>
            </form>
        </article>
    </div>
</main>
</body>
</html>
