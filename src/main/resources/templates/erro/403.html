<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso não autorizado | SEPLAG-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/seplag-ui.css}">
</head>
<body class="min-h-screen flex items-center justify-center px-4">
<main class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-xl">
    <p class="text-sm font-bold uppercase tracking-widest text-sky-300">Erro 403</p>
    <h1 class="mt-3 text-3xl font-bold">Acesso não autorizado</h1>
    <p class="mt-3 text-sm text-gray-300" th:text="${mensagem}">Você não tem permissão para acessar este conteúdo.</p>
    <a th:href="@{/}" class="mt-6 inline-flex rounded-lg bg-[#1d6498] px-5 py-2.5 text-sm font-semibold text-white">Voltar à plataforma</a>
</main>
</body>
</html>
