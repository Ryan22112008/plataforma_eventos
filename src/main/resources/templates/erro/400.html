<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 400 | Requisição Inválida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F4F6F9] min-h-screen flex flex-col items-center justify-center p-4">

<div class="mb-6 flex justify-center">
    <img th:src="@{/images/images.png}" alt="Logotipo SEPLAG-MT" class="h-16 w-auto object-contain select-none">
</div>

<div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full text-center border border-gray-200">

    <div class="w-12 h-12 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-triangle-exclamation text-xl text-amber-600"></i>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-2">Erro 400 - Requisição Inválida</h1>
    <p class="text-sm text-gray-600 mb-6">O servidor não conseguiu processar a requisição devido a parâmetros incorretos ou dados inválidos.</p>

    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 text-xs p-3 rounded text-left font-mono mb-6 whitespace-pre-wrap break-all"
         th:text="${mensagemErro}">
        Detalhes do erro do Spring aparecerão aqui para o diagnóstico.
    </div>

    <a th:href="@{/dashboard}"
       class="w-full inline-flex justify-center items-center bg-[#00457C] hover:bg-[#00335c] text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm">
        <i class="fa-solid fa-house-chimney mr-2"></i> Voltar ao Painel
    </a>
</div>

</body>
</html>
