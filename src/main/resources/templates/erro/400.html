<!DOCTYPE html>
<html lang="pt-BR" class="v2-root" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/seplag-ui :: head('Erro 400 | Requisição Inválida')}">
    <title>Erro 400 | SEPLAG-MT</title>
</head>
<body class="v2 seplag-error-page">
    <main class="seplag-auth">
        <div class="seplag-auth__inner">
            <div class="seplag-auth__brand">
                <img th:src="@{/images/logo-seplag-branco.png}" alt="Logotipo SEPLAG-MT" class="seplag-auth__logo">
            </div>
            <section class="seplag-card" aria-labelledby="error-title">
                <div class="seplag-card__body seplag-error__body">
                    <div class="seplag-error__icon seplag-error__icon--warning" aria-hidden="true">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h1 id="error-title">Erro 400 - Requisição Inválida</h1>
                    <p>O servidor não conseguiu processar a requisição devido a parâmetros incorretos ou dados inválidos.</p>
                    <div th:if="${mensagemErro}" class="seplag-alert seplag-alert--error" role="alert" th:text="${mensagemErro}">Detalhes do erro do Spring aparecerão aqui para o diagnóstico.</div>
                    <div class="seplag-error__actions">
                        <a th:href="@{/dashboard}" class="seplag-btn seplag-btn-primary">Voltar ao Painel</a>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
