<!DOCTYPE html>
<html lang="pt-BR" class="v2-root" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/seplag-ui :: head('Página não encontrada')}">
    <title>Página não encontrada | SEPLAG-MT</title>
</head>
<body class="v2 seplag-error-page">
    <main class="seplag-auth">
        <div class="seplag-auth__inner">
            <div class="seplag-auth__brand">
                <img th:src="@{/images/logo-seplag-branco.png}" alt="Logotipo SEPLAG-MT" class="seplag-auth__logo">
            </div>
            <section class="seplag-card" aria-labelledby="error-title">
                <div class="seplag-card__body seplag-error__body">
                    <div class="seplag-error__icon" aria-hidden="true">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <h1 id="error-title">Página não encontrada</h1>
                    <p class="seplag-error__code">Erro 404</p>
                    <p>O endereço acessado não existe ou foi movido. Verifique o link e tente novamente.</p>
                    <div class="seplag-error__actions">
                        <a th:href="@{/}" class="seplag-btn seplag-btn-primary">Voltar à plataforma</a>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
