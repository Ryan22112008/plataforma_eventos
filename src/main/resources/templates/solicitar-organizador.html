<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Acesso de Organizador | SEPLAG-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <link rel="stylesheet" th:href="@{/css/seplag-ui.css}">
</head>
<body class="bg-[#F4F6F9] min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

<div class="sm:mx-auto w-full max-w-md">
    <div class="text-center">
        <div class="flex justify-center mb-4">
            <img th:src="@{/images/logo-seplag-branco.png}" alt="Logotipo SEPLAG-MT" class="h-24 w-auto object-contain drop-shadow-sm select-none">
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-[#00457C]">Solicitar Acesso de Organizador</h2>
        <p class="mt-2 text-sm text-gray-600">Preencha os dados abaixo para solicitar a análise da administração.</p>
    </div>

    <div class="mt-8 sm:mx-auto w-full max-w-md px-4 sm:px-0">
        <div class="bg-white py-8 px-4 shadow sm:rounded-xl sm:px-10 border border-gray-200">

            <div th:if="${erroSolicitacaoOrganizador}" class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded text-sm text-red-700">
                <i class="fa-solid fa-triangle-exclamation mr-2"></i> <span th:text="${erroSolicitacaoOrganizador}">Erro</span>
            </div>

            <form th:action="@{/participante/solicitar-organizador}" th:object="${solicitacaoDto}" method="POST" class="space-y-5">

                <div>
                    <label for="nomeCompleto" class="block text-sm font-medium text-gray-700">Nome Completo</label>
                    <input type="text" th:field="*{nomeCompleto}" id="nomeCompleto" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-[#00457C] focus:outline-none focus:ring-1 focus:ring-[#00457C]">
                    <p th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <div>
                    <label for="matricula" class="block text-sm font-medium text-gray-700">Matrícula</label>
                    <input type="text" th:field="*{matricula}" id="matricula" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-[#00457C] focus:outline-none focus:ring-1 focus:ring-[#00457C]">
                    <p th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <div>
                    <label for="emailInstitucional" class="block text-sm font-medium text-gray-700">E-mail Institucional</label>
                    <input type="email" th:field="*{emailInstitucional}" id="emailInstitucional" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-[#00457C] focus:outline-none focus:ring-1 focus:ring-[#00457C]">
                    <p th:if="${#fields.hasErrors('emailInstitucional')}" th:errors="*{emailInstitucional}" class="mt-1 text-xs text-red-600 font-medium"></p>
                </div>

                <div>
                    <label for="justificativa" class="block text-sm font-medium text-gray-700">Justificativa da Solicitação</label>
                    <textarea th:field="*{justificativa}" id="justificativa" rows="4" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-[#00457C] focus:outline-none focus:ring-1 focus:ring-[#00457C]"></textarea>
                    <p th:if="${#fields.hasErrors('justificativa')}" th:errors="*{justificativa}" class="mt-1 text-xs text-red-600 font-medium"></p>
                    <p class="mt-1 text-xs text-gray-500">Máximo de 1000 caracteres.</p>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-semibold text-white bg-[#008A4B] hover:bg-[#00703c] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#008A4B]">
                        Enviar Solicitação
                    </button>
                </div>
            </form>

            <div class="mt-6 border-t border-gray-200 pt-6 text-center text-sm">
                <a th:href="@{/eventos}" class="font-medium text-[#00457C] hover:underline ml-1">Voltar aos eventos</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
