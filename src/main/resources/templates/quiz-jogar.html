<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/seplag-ui :: head('Quiz ao vivo')}"></head><body class="quiz-public quiz-play"><header class="quiz-play-top"><a th:href="@{/dashboard}" class="quiz-back">SEPLAG <b>QUIZ</b></a><span><span th:text="${jogador.avatar == 'raposa' ? '🦊' : jogador.avatar == 'gato' ? '🐱' : jogador.avatar == 'robo' ? '🤖' : jogador.avatar == 'coruja' ? '🦉' : jogador.avatar == 'capivara' ? '🦫' : '🚀'}">🚀</span> <span th:text="${jogador.apelido != null ? jogador.apelido : jogador.usuario.nome}">Jogador</span></span></header><main class="quiz-play-main"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><section class="player-wait" id="play-status"><div class="quiz-wait-emoji">🎮</div><p class="quiz-eyebrow">VOCÊ ESTÁ NA SALA</p><h1>A partida vai começar</h1><p>Olhe para a tela do anfitrião. As respostas aparecerão aqui quando a pergunta for liberada.</p><div class="quiz-loader"></div></section><section class="player-answer" id="live" hidden><div class="player-round-head"><span id="round-label">PERGUNTA 1</span><span id="player-timer">Aguarde…</span></div><div class="player-progress"><i id="player-progress"></i></div><p class="player-instruction" id="player-instruction">Toque na forma da sua resposta</p><div class="player-shapes" id="options"></div><div class="player-feedback" id="answer-feedback" hidden></div></section><section class="player-finished" id="finished" hidden><div class="quiz-wait-emoji">🏆</div><p class="quiz-eyebrow">QUIZ ENCERRADO</p><h1>Valeu por jogar!</h1><p>Sua pontuação final</p><strong id="final-score">0 pts</strong><div id="final-rank"></div><a th:href="@{/dashboard}" class="player-return">Voltar ao painel</a></section></main><script th:inline="javascript">window.quizCode=[[${quiz.codigo}]];</script><script th:src="@{/js/quiz-play.js}"></script></body></html>
