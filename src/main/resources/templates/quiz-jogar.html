<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/seplag-ui :: head('Quiz ao vivo')}"></head><body class="quiz-public quiz-play"><header class="quiz-play-top"><a href="/dashboard" class="quiz-back">SEPLAG Eventos</a><b th:text="${quiz.titulo}">Quiz</b><span><span th:text="${jogador.avatar == 'raposa' ? '🦊' : jogador.avatar == 'gato' ? '🐱' : jogador.avatar == 'robo' ? '🤖' : jogador.avatar == 'coruja' ? '🦉' : jogador.avatar == 'capivara' ? '🦫' : '🚀'}">🚀</span> <span th:text="${jogador.usuario.nome}">Jogador</span></span></header><main class="quiz-play-main"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="quiz-play-status" id="play-status"><div class="quiz-wait-emoji">🎮</div><p class="quiz-eyebrow">VOCÊ ESTÁ NA SALA</p><h1>A partida vai começar</h1><p>Olhe para a tela principal. O organizador vai liberar as perguntas.</p><div class="quiz-loader"></div></div><div class="quiz-live" id="live" hidden><div class="quiz-live-head"><span class="quiz-chip" id="q-count">Pergunta</span><div class="quiz-timer"><div id="timer-bar"></div></div><strong id="timer-text">20s</strong></div><div class="quiz-live-question"><img id="q-image" hidden alt="Imagem da pergunta"><h1 id="q-text"></h1></div><div class="quiz-options" id="options"></div><div id="answer-feedback" class="quiz-feedback" hidden></div><section class="quiz-live-ranking"><b>🏆 Ranking da rodada</b><div id="live-rank"></div></section></div><div class="quiz-finished" id="finished" hidden><div class="quiz-wait-emoji">🏆</div><p class="quiz-eyebrow">PARTIDA ENCERRADA</p><h1>Mandou muito bem!</h1><p>Sua pontuação final</p><strong id="final-score">0</strong><div id="final-rank"></div><a href="/dashboard" class="quiz-btn">Voltar ao painel</a></div></main><script th:inline="javascript">window.quizCode=[[${quiz.codigo}]];</script><script th:src="@{/js/quiz-play.js}"></script></body></html>
