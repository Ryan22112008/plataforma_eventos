<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/seplag-ui :: head('Entrar no quiz')}"></head><body class="quiz-public"><main class="quiz-join-card"><a th:href="@{/quiz/entrar}" class="quiz-back">← Inserir PIN</a><div class="quiz-public-logo"><img th:src="@{/images/logo-seplag-branco.png}" alt="SEPLAG-MT"></div><p class="quiz-eyebrow">QUIZ AO VIVO · <span th:text="${quiz.evento.titulo}">Evento</span></p><h1 th:text="${quiz.titulo}">Quiz</h1><p th:text="${quiz.descricao}">Descrição</p><div th:if="${erroEntrada}" class="quiz-entry-error" role="alert" th:text="${erroEntrada}">Erro</div><form th:action="@{/quiz/entrar/{codigo}(codigo=${quiz.codigo})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="quiz-nickname-label">Como quer aparecer na partida?<input type="text" name="apelido" required minlength="2" maxlength="24" autocomplete="nickname" th:value="${nomeSugerido}" placeholder="Seu apelido"></label><fieldset><legend>Escolha seu personagem</legend><div class="quiz-avatars"><label><input type="radio" name="avatar" value="astronauta" checked><span>🚀</span><small>Astro</small></label><label><input type="radio" name="avatar" value="raposa"><span>🦊</span><small>Foxy</small></label><label><input type="radio" name="avatar" value="gato"><span>🐱</span><small>Mimi</small></label><label><input type="radio" name="avatar" value="robo"><span>🤖</span><small>Bit</small></label><label><input type="radio" name="avatar" value="coruja"><span>🦉</span><small>Coruja</small></label><label><input type="radio" name="avatar" value="capivara"><span>🦫</span><small>Capi</small></label></div></fieldset><button class="quiz-btn quiz-btn-wide">Entrar na sala <span>→</span></button></form><p class="quiz-join-note">A sala é exclusiva para usuários com inscrição ativa neste evento. Cada pessoa tem uma tentativa.</p></main></body></html>
