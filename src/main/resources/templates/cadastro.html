<!DOCTYPE html>
<html lang="pt-BR" class="v2-root" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/seplag-ui :: head('Criar Conta | Portal SEPLAG-MT')}">
    <title>Criar Conta | SEPLAG-MT</title>
</head>
<body class="v2 seplag-auth-page">
    <main class="seplag-auth">
        <div class="seplag-auth__inner">
            <div class="seplag-auth__brand">
                <img th:src="@{/images/logo-seplag-branco.png}" alt="Logotipo SEPLAG-MT" class="seplag-auth__logo">
                <p class="seplag-auth__org">SEPLAG — Mato Grosso</p>
            </div>
            <section class="seplag-card seplag-auth__card" aria-labelledby="cadastro-title">
                <div class="seplag-auth__header">
                    <p class="seplag-eyebrow">Criar sua conta</p>
                    <h1 id="cadastro-title">Plataforma de Eventos SEPLAG</h1>
                    <p>Crie sua conta para se inscrever em cursos e acessar seus certificados. Depois de entrar, você pode solicitar acesso para criar cursos.</p>
                </div>

                <div th:if="${erroNegocio}" class="seplag-alert seplag-alert--error" role="alert">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                    <span th:text="${erroNegocio}">Erro</span>
                </div>

                <form th:action="@{/cadastro}" th:object="${usuarioDto}" method="POST" class="seplag-form">

                    <div class="seplag-field">
                        <label for="nome" class="seplag-label">Nome Completo</label>
                        <input type="text" th:field="*{nome}" id="nome" class="seplag-input">
                        <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="seplag-error"></p>
                    </div>

                    <div class="seplag-field">
                        <label for="email" class="seplag-label">E-mail Institucional ou Pessoal</label>
                        <input type="email" th:field="*{email}" id="email" class="seplag-input">
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="seplag-error"></p>
                    </div>

                    <div class="seplag-field">
                        <label for="senha" class="seplag-label">Senha</label>
                        <div class="seplag-password">
                            <input type="password" th:field="*{senha}" id="senha" minlength="12" maxlength="72" autocomplete="new-password" required class="seplag-input">
                            <button type="button" class="seplag-password__toggle"
                                    data-seplag-password-toggle aria-controls="senha"
                                    aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
                                <i class="fa-solid fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p class="seplag-hint">Use de 12 a 72 caracteres.</p>
                        <p th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="seplag-error"></p>
                    </div>

                    <div class="seplag-field">
                        <label for="confirmacaoSenha" class="seplag-label">Confirme sua Senha</label>
                        <div class="seplag-password">
                            <input type="password" th:field="*{confirmacaoSenha}" id="confirmacaoSenha" minlength="12" maxlength="72" autocomplete="new-password" required class="seplag-input">
                            <button type="button" class="seplag-password__toggle"
                                    data-seplag-password-toggle aria-controls="confirmacaoSenha"
                                    data-label-show="Mostrar confirmação de senha"
                                    data-label-hide="Ocultar confirmação de senha"
                                    aria-label="Mostrar confirmação de senha" aria-pressed="false"
                                    title="Mostrar confirmação de senha">
                                <i class="fa-solid fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p th:if="${#fields.hasErrors('confirmacaoSenha')}" th:errors="*{confirmacaoSenha}" class="seplag-error"></p>
                    </div>

                    <button type="submit" class="seplag-btn seplag-btn-primary seplag-btn--block">Finalizar Cadastro</button>
                </form>

                <div class="seplag-auth__footer">
                    <p>Já possui uma conta? <a th:href="@{/login}">Fazer Login</a></p>
                </div>
            </section>
        </div>
    </main>
    <script th:src="@{/js/seplag-shell.js}" defer></script>
</body>
</html>
