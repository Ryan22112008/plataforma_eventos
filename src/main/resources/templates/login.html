<!DOCTYPE html>
<html lang="pt-BR" class="v2-root" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/seplag-ui :: head('Acesso ao Sistema')}">
    <title>Acesso ao Sistema | SEPLAG-MT</title>
</head>
<body class="v2 seplag-auth-page">

<main class="seplag-auth">
    <div class="seplag-auth__inner">

        <div class="seplag-auth__brand">
            <img th:src="@{/images/logo-seplag-branco.png}" alt="Logotipo SEPLAG-MT" class="seplag-auth__logo">
        </div>

        <section class="seplag-card seplag-auth__card" aria-labelledby="login-title">

            <div class="seplag-auth__header">
                <p class="seplag-eyebrow">Acesso institucional</p>
                <h1 id="login-title">Área do Usuário SEPLAG</h1>
                <p>Acesse cursos, inscrições e certificados.</p>
            </div>

            <div class="seplag-auth__alerts"
                 th:if="${param.sucesso != null or param.error != null or param.logout != null}">
                <div th:if="${param.sucesso}" class="seplag-alert seplag-alert--success" role="status">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    <span>Cadastro efetuado! Faça seu login agora.</span>
                </div>

                <div th:if="${param.error}" class="seplag-alert seplag-alert--error" role="alert">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                    <span>E-mail ou senha inválidos.</span>
                </div>

                <div th:if="${param.logout}" class="seplag-alert seplag-alert--info" role="status">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                    <span>Você saiu do sistema com segurança.</span>
                </div>
            </div>

            <form th:action="@{/login}" method="POST" class="seplag-form">
                <div class="seplag-field">
                    <label for="email" class="seplag-label">E-mail cadastrado</label>
                    <input type="email" name="username" id="email" autocomplete="username" required
                           class="seplag-input">
                </div>

                <div class="seplag-field">
                    <label for="senha" class="seplag-label">Sua senha</label>
                    <input type="password" name="password" id="senha" autocomplete="current-password" required
                           class="seplag-input">
                </div>

                <button type="submit" class="seplag-btn seplag-btn-primary seplag-btn--block">
                    Entrar no Painel
                </button>
            </form>

            <div class="seplag-auth__footer">
                <p>Não tem acesso? <a th:href="@{/cadastro}">Criar uma conta gratuita</a></p>
                <a th:href="@{/}" class="seplag-auth__back">
                    <i class="fa-solid fa-house-chimney" aria-hidden="true"></i>
                    Voltar para a Vitrine de Eventos
                </a>
            </div>
        </section>

    </div>
</main>

</body>
</html>
