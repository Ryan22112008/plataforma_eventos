<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#082f57">
    <title>QR Codes de Presença | SEPLAG-MT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/seplag-ui.css}">
</head>
<body class="min-h-screen bg-[#F4F6F9] text-gray-900">
<header class="bg-[#082f57] text-white border-b-4 border-[#FDB813]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex items-center justify-between gap-4">
        <div>
            <p class="text-xs uppercase tracking-widest text-blue-200">Presença por sessão</p>
            <h1 class="text-xl sm:text-2xl font-bold mt-1" th:text="${evento.titulo}">Evento</h1>
        </div>
        <a th:href="@{/organizador/eventos/{id}/inscritos(id=${evento.id})}"
           class="shrink-0 inline-flex items-center gap-2 rounded-lg bg-white/10 hover:bg-white/20 px-4 py-2 text-sm font-semibold focus-visible:outline-white">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>Voltar</span>
        </a>
    </div>
</header>

<main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-8">
    <div class="mb-6 rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-900">
        <i class="fa-solid fa-circle-info mr-2" aria-hidden="true"></i>
        Cada código registra presença na sessão correspondente. O participante precisa entrar na conta e ter inscrição ativa.
    </div>

    <div th:if="${codigosSessoes == null or codigosSessoes.isEmpty()}" class="rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm">
        <i class="fa-regular fa-calendar-xmark text-3xl text-gray-400" aria-hidden="true"></i>
        <h2 class="mt-3 font-bold text-lg">Este evento ainda não tem sessões</h2>
        <p class="mt-1 text-sm text-gray-600">As sessões e seus QR codes aparecerão aqui quando estiverem configurados.</p>
    </div>

    <div th:if="${codigosSessoes != null and !codigosSessoes.isEmpty()}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <article th:each="codigo : ${codigosSessoes}" class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm flex flex-col items-center text-center">
            <h2 class="font-bold text-[#082f57]" th:text="${codigo.sessao.nome}">Sessão</h2>
            <p class="text-sm text-gray-600 mt-1" th:text="${#temporals.format(codigo.sessao.dataHoraInicio, 'dd/MM/yyyy HH:mm')}">Data e hora</p>
            <img th:src="${codigo.qrCodeBase64}" th:alt="|QR Code de presença para ${codigo.sessao.nome}|"
                 class="mt-4 w-56 h-56 rounded-lg border border-gray-100 p-2" width="224" height="224">
            <a th:href="${codigo.url}" class="mt-3 text-xs text-[#0b4d7e] underline break-all" th:text="${codigo.url}">Link</a>
        </article>
    </div>
</main>
</body>
</html>
